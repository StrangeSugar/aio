# 生产环境部署 — 全部服务（Knowledge + Panel + Web + Core + Proxy）
#
# 用法：
#   docker compose -f deploy/docker-compose.prod.yml up -d    # 启动
#   docker compose -f deploy/docker-compose.prod.yml logs -f  # 看日志
#   docker compose -f deploy/docker-compose.prod.yml down     # 停止
#
# 配置：复制 .env.example 为 .env 并填入实际值
#   cp deploy/.env.example deploy/.env

services:
  # ── MemoryCore 网关 ──
  memory-core:
    image: agentmemory/memory-core:latest
    container_name: tdai-memory-core
    ports:
      - "8420:8420"
    volumes:
      - tdai-memory-core-data:/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/health"]
      interval: 30s
      timeout: 8s
      retries: 10
    networks:
      - tdai-net

  # ── MemoryProxy ──
  memory-proxy:
    image: agentmemory/memory-proxy:latest
    container_name: tdai-proxy
    ports:
      - "8096:8096"
    volumes:
      - tdai-proxy-data:/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 8s
      retries: 10
    networks:
      - tdai-net

  # ── Knowledge Service ──
  knowledge:
    image: agentmemory/memory-hub:prod
    container_name: tdai-knowledge
    ports:
      - "8424:8424"
    volumes:
      - tdai-knowledge-data:/data/knowledge
    environment:
      - NODE_ENV=production
      - KNOWLEDGE_PORT=8424
      - KNOWLEDGE_DATA_DIR=/data/knowledge
      - KNOWLEDGE_DB_PATH=/data/knowledge/knowledge.db
      - GIT_SSL_NO_VERIFY=1
      # LLM 配置 — 通过 deploy/.env 注入
      - LLM_MODE=${LLM_MODE:-custom}
      - LLM_PROTOCOL=${LLM_PROTOCOL:-openai}
      - LLM_PROVIDER=${LLM_PROVIDER:-custom}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-32768}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-1200000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8424/health"]
      interval: 30s
      timeout: 8s
      retries: 10
    depends_on:
      - memory-proxy
    networks:
      - tdai-net

  # ── Panel 后端（生产模式）──
  panel-backend:
    image: agentmemory/memory-panel:latest
    container_name: tdai-panel-backend
    ports:
      - "8125:8125"
    environment:
      - NODE_ENV=production
      - PORT=8125
      - HOST=0.0.0.0
      - METADATA_INSTANCES_CONFIG=./config/metadata-instances.json
      - KNOWLEDGE_SERVICE_URL=http://knowledge:8424
      - META_PROXY_URL=http://memory-proxy:8096
      - METADATA_REMOTE_TIMEOUT_MS=15000
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - knowledge
      - memory-proxy
      - memory-core
    networks:
      - tdai-net

  # ── Web 前端（生产模式 — 静态文件 + nginx）──
  web-frontend:
    image: agentmemory/memory-web:latest
    container_name: tdai-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_BACKEND_URL=http://panel-backend:8125
      - NGINX_KNOWLEDGE_URL=http://knowledge:8424
    restart: unless-stopped
    depends_on:
      - panel-backend
    networks:
      - tdai-net

networks:
  tdai-net:
    name: tdai-memory-stack
    driver: bridge

volumes:
  tdai-memory-core-data:
    name: tdai-memory-core-data
  tdai-proxy-data:
    name: tdai-proxy-data
  tdai-knowledge-data:
    name: tdai-knowledge-data
